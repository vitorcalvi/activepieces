services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: run
    image: activepieces-fork:local
    restart: unless-stopped
    env_file: .env
    environment:
      AP_CONTAINER_TYPE: APP
      AP_EDITION: ce
      AP_ENVIRONMENT: prod
      AP_FRONTEND_URL: ${AP_FRONTEND_URL:?required}
      AP_ENCRYPTION_KEY: ${AP_ENCRYPTION_KEY:?required}
      AP_JWT_SECRET: ${AP_JWT_SECRET:?required}
      AP_POSTGRES_HOST: postgres
      AP_POSTGRES_PORT: '5432'
      AP_POSTGRES_DATABASE: activepieces
      AP_POSTGRES_USERNAME: activepieces
      AP_POSTGRES_PASSWORD: ${AP_POSTGRES_PASSWORD:?required}
      AP_REDIS_HOST: redis
      AP_REDIS_PORT: '6379'
      AP_EXECUTION_MODE: SANDBOX_CODE_ONLY
      AP_TELEMETRY_ENABLED: 'false'
    volumes:
      - cache:/usr/src/app/cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:80/api/v1/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - private
      - dokploy-network
  worker:
    image: activepieces-fork:local
    pull_policy: never
    restart: unless-stopped
    env_file: .env
    environment:
      AP_CONTAINER_TYPE: WORKER
      AP_EDITION: ce
      AP_ENVIRONMENT: prod
      AP_FRONTEND_URL: http://app
      AP_ENCRYPTION_KEY: ${AP_ENCRYPTION_KEY:?required}
      AP_JWT_SECRET: ${AP_JWT_SECRET:?required}
      AP_POSTGRES_HOST: postgres
      AP_POSTGRES_PORT: '5432'
      AP_POSTGRES_DATABASE: activepieces
      AP_POSTGRES_USERNAME: activepieces
      AP_POSTGRES_PASSWORD: ${AP_POSTGRES_PASSWORD:?required}
      AP_REDIS_HOST: redis
      AP_REDIS_PORT: '6379'
      AP_EXECUTION_MODE: SANDBOX_CODE_ONLY
      AP_TELEMETRY_ENABLED: 'false'
      AP_WORKER_CONCURRENCY: '1'
      AP_REUSE_SANDBOX: 'true'
    volumes:
      - cache:/usr/src/app/cache
    depends_on:
      app:
        condition: service_healthy
    networks:
      - private
  postgres:
    image: pgvector/pgvector:0.8.0-pg14
    restart: unless-stopped
    environment:
      POSTGRES_DB: activepieces
      POSTGRES_USER: activepieces
      POSTGRES_PASSWORD: ${AP_POSTGRES_PASSWORD:?required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U activepieces -d activepieces']
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - private
  redis:
    image: redis:7.0.7
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '256mb', '--maxmemory-policy', 'noeviction']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - private
volumes:
  cache:
  pgdata:
  redisdata:
networks:
  private:
  dokploy-network:
    external: true
